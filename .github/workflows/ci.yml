name: CI

# Every push and pull request: typecheck the game, the room server and the Pages Functions, run the
# tests, and make sure the game still builds.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run server:check
      - run: npm test
      - run: npm run build
