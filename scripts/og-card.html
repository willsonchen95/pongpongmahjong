<!doctype html>
<!-- The link-preview picture (public/og-image.jpg, 1200×630) that LinkedIn, WhatsApp and others show
     for the game's address: the logo, and the real game on a laptop and a phone, mid-hand. To remake it, run
     `npm run dev` and then `node scripts/make-og-image.mjs`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=block" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E9%BA%BB%E9%9B%80%E4%B8%AD%E7%99%BC%E6%9D%B1&display=block" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      .card *, .card *::before, .card *::after { animation: none !important; transition: none !important; }
      .card { box-sizing: border-box; width: 1200px; height: 630px; display: flex; align-items: center; justify-content: center; gap: 30px; padding: 0 36px; }
      .left { flex: none; width: 520px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .left .menu-hero { transform: scale(0.98); transform-origin: 50% 100%; }
      /* the words under the logo: quiet, in the logo's colours, no boxes */
      .rule { width: 84px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, #ffd75e, transparent); }
      .lede { margin: 0; max-width: 500px; text-align: center; text-wrap: balance; color: #fff6d6; font-size: 1.45rem; font-weight: 600; line-height: 1.4;
              text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
      .lede b { color: #ffd75e; font-weight: 800; }
      .url { color: rgba(255, 246, 214, 0.75); font-size: 1.2rem; font-weight: 600; }
      .url b { color: #ffd75e; font-weight: 800; }
      .devices { position: relative; flex: none; width: 580px; height: 520px; }
      .screen { position: absolute; overflow: hidden; background: #6e1210; }
      .screen iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
      /* the laptop: the game at a computer's size (1280×800), shown at 0.4 */
      .laptop { position: absolute; left: 0; top: 30px; width: 540px; filter: drop-shadow(0 20px 18px rgba(0, 0, 0, 0.45)); }
      /* a thin black bezel with a camera dot, on a slim metal base with the finger notch at the front */
      .lid { position: relative; width: 540px; height: 344px; border-radius: 16px 16px 3px 3px; background: #0d0d0f;
             box-shadow: inset 0 0 0 1.5px #2e2e33, 0 -1px 0 1px rgba(255, 255, 255, 0.06); }
      .lid::before { content: ''; position: absolute; left: 50%; top: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #2a2d36; }
      .lid .screen { left: 14px; top: 14px; width: 512px; height: 320px; border-radius: 3px; }
      .lid iframe { width: 1280px; height: 800px; transform: scale(0.4); }
      .base { position: relative; width: 616px; height: 13px; margin-left: -38px; border-radius: 2px 2px 14px 14px / 2px 2px 11px 11px;
              background: linear-gradient(#f1f1f4, #c9c9cf 45%, #9a9aa2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8); }
      .base::before { content: ''; position: absolute; left: 50%; top: 0; width: 96px; height: 5px; margin-left: -48px;
                      border-radius: 0 0 7px 7px; background: linear-gradient(#a8a8b0, #c4c4ca); }
      /* the phone in front: the game laid out at its phone width (480), shown at 0.4 */
      .phone { position: absolute; right: -6px; top: 92px; width: 208px; height: 432px; border-radius: 32px; background: #121212;
               box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 2px #3a3a3a; rotate: 5deg; }
      .phone .screen { left: 8px; top: 9px; width: 192px; height: 414px; border-radius: 25px; }
      .phone iframe { width: 480px; height: 1035px; transform: scale(0.4); }
    </style>
  </head>
  <body>
    <div id="card" class="card"></div>
    <script type="module">
      import '/src/style.css'
      import { el, tileEl } from '/src/ui.ts'
      import { parse } from '/src/engine.ts'
      import { Table } from '/src/table.ts'

      // A hand worth looking at: play it with four bots until it's halfway through, a few sets are
      // down (one of them yours) and it's your turn — then hand your seat back to you and save it, so
      // the game opens straight onto that table.
      function stagedTable() {
        for (let attempt = 0; attempt < 300; attempt++) {
          const t = new Table({ rounds: 1, minFaan: 1, startPoints: 1000, bots: 'normal' }, [false, false, false, false])
          t.newHand(); t.begin()
          for (let i = 0; i < 4000; i++) {
            const p = t.phase, g = t.game
            if (p.kind === 'over') break
            const melds = g.melds.filter(m => m.length).length
            if (p.kind === 'turn' && p.seat === 0 && g.wall.length < 80 && g.melds[0].length && melds >= 2) {
              t.humans[0] = true
              return t
            }
            if (p.kind === 'next') t.startTurn()
            else if (p.kind === 'discarded') t.afterDiscard()
            else if (p.kind === 'turn') t.botMove()
            else break
          }
        }
        throw new Error('no good table found')
      }
      localStorage.clear()
      localStorage.setItem('mahjong-settings', JSON.stringify({ tips: false, rounds: 1, minFaan: 1, bots: 'normal', startPoints: 1000 }))
      localStorage.setItem('mahjong-save-v2', JSON.stringify({ table: stagedTable().toData(), wallBreak: 5, resultClosed: false, showFinal: false }))

      // the menu's title area (main.ts menuHero), without its entrance animation
      const hero = el('div', 'menu-hero')
      const fan = el('div', 'tile-fan')
      for (const spec of ['1p', '5z', '6z', '1s', '1z']) fan.appendChild(tileEl(parse(spec)[0], 'fan-tile'))
      const title = el('h1', 'menu-title')
      const top = el('span', 'mt-line')
      top.append(el('span', 'mt-word', 'Pong'), el('span', 'mt-word', 'Pong'))
      const big = el('span', 'mt-line mt-big')
      big.appendChild(el('span', 'mt-word', 'Mahjong!'))
      title.append(top, big)
      hero.append(fan, title, el('div', 'menu-cn', '麻雀'))

      const lede = el('p', 'lede')
      lede.append('Hong Kong mahjong for the web. Play friends on ', el('b', '', 'iPhone, Android or PC'), ' at the same table — or practise against smart bots.')
      const left = el('div', 'left')
      const url = el('div', 'url')
      url.append('Play it at ', el('b', '', 'pongpongmahjong.pages.dev'))
      left.append(hero, el('div', 'rule'), lede, url)

      // the real game, opened onto the saved table: `src` '/' is the computer's 3D table, '/?lite' a phone's
      function game(src) {
        const screen = el('div', 'screen'), frame = document.createElement('iframe')
        frame.src = src
        frame.onload = () => {
          const go = () => {
            const resume = [...frame.contentDocument.querySelectorAll('.menu-card')].find(b => b.textContent.includes('Continue game'))
            if (resume) resume.click(); else setTimeout(go, 100)
          }
          go()
        }
        screen.appendChild(frame)
        return screen
      }
      const laptop = el('div', 'laptop'), lid = el('div', 'lid'), phone = el('div', 'phone')
      lid.appendChild(game('/'))
      laptop.append(lid, el('div', 'base'))
      phone.appendChild(game('/?lite'))
      const devices = el('div', 'devices')
      devices.append(laptop, phone)
      document.getElementById('card').append(left, devices)
    </script>
  </body>
</html>
