<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Phones show the game scaled to fit, like a picture: held sideways it's laid out for a screen
      // 960 wide, then shrunk to the phone's real width, so every phone shows the same proportions
      // instead of a zoomed-in close-up. Upright (the "turn sideways" note) and on tablets and
      // computers it's shown at its natural size.
      (function () {
        var DESIGN_WIDTH = 960
        function fit() {
          var short = Math.min(screen.width, screen.height), long = Math.max(screen.width, screen.height)
          var sideways = matchMedia('(orientation: landscape)').matches
          var content = 'width=device-width, initial-scale=1.0'
          if (short <= 500 && sideways && long < DESIGN_WIDTH) {
            content = 'width=' + DESIGN_WIDTH + ', initial-scale=' + (long / DESIGN_WIDTH).toFixed(3)
          }
          var meta = document.getElementById('viewport')
          if (meta.getAttribute('content') !== content) meta.setAttribute('content', content)
        }
        fit()
        addEventListener('orientationchange', function () { setTimeout(fit, 150) })
        addEventListener('resize', fit)
      })()
    </script>
    <title>Pong Pong Mahjong!</title>
    <!-- Only the characters drawn on tile faces, so the font download stays tiny -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The chunky display face for the game's name on the menu -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BC%8D%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E8%90%AC%E6%9D%B1%E5%8D%97%E8%A5%BF%E5%8C%97%E4%B8%AD%E7%99%BC%E6%98%A5%E5%A4%8F%E7%A7%8B%E5%86%AC%E6%A2%85%E8%98%AD%E7%AB%B9%E8%8F%8A%E9%BA%BB%E9%9B%800123456789&display=block" />
  </head>
  <body>
    <div id="app"></div>
    <!-- shown only on a phone held upright: the game is played sideways (see .rotate-note) -->
    <div class="rotate-note">
      <div class="rn-phone"></div>
      <div>Turn your phone sideways to play</div>
      <div class="rn-sub">Pong Pong Mahjong is played in landscape.</div>
      <button class="act primary" id="rotate-fullscreen" hidden>Play full screen</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
