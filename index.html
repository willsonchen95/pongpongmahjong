    <script>
      // Phones show the game scaled to fit, like a picture: it's laid out for a bigger screen, then
      // shrunk to the phone's real width, so every phone shows the same proportions as a computer
      // instead of a zoomed-in close-up. Held upright it's laid out 480 wide; sideways about 1120
      // wide (less on a stubbier phone, so the page stays under 600 tall and gets the sideways
      // layout in style.css). Tablets and computers are shown at their natural size.
      (function () {
        var last = null
        function fit() {
          var short = Math.min(screen.width, screen.height), long = Math.max(screen.width, screen.height)
          // the space the page really gets, in real pixels: the visible area times the current zoom.
          // (Not the screen size: sideways, some phones keep a strip by the camera free, and right
          // after turning, the page's own size still belongs to the old layout.)
          var vv = window.visualViewport
          var w = vv ? vv.width * vv.scale : innerWidth, h = vv ? vv.height * vv.scale : innerHeight
          var sideways = vv ? w > h : matchMedia('(orientation: landscape)').matches
          var real = vv ? Math.round(w) : (sideways ? long : short)
          var design = sideways ? Math.min(1120, Math.floor(590 * long / short)) : 480
          // the zoom is pinned (min = max), because after turning the phone Chrome keeps the old
          // zoom and the new layout would hang off the side of the screen
          var content = 'width=device-width, initial-scale=1.0, minimum-scale=1.0'
          if (short <= 500 && real < design) {
            var scale = (real / design).toFixed(3)
            // measuring after a change can come out a pixel different: keep the zoom we have then,
            // rather than nudging it back and forth
            if (last && last.design === design && Math.abs(last.scale - scale) / scale < 0.01) scale = last.scale
            last = { design: design, scale: scale }
            content = 'width=' + design + ', initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=' + scale
          }
          var meta = document.getElementById('viewport')
          if (meta.getAttribute('content') !== content) meta.setAttribute('content', content)
        }
        fit()
        addEventListener('orientationchange', function () { setTimeout(fit, 150) })
        addEventListener('resize', fit)
        if (window.visualViewport) visualViewport.addEventListener('resize', fit)   // also once the new zoom settles
      })()
    </script>
    <script>
      // Touch screens get real 3D tiles with only the sides you can see drawn, which halves the work
      // (see style.css: phones always; tablets and an opened Fold through .cull3d) — flat tiles on the
      // tilted table look like stickers. ?lite previews the old flat tiles (.lite3d) on a computer.
      (function () {
        var touch = matchMedia('(pointer: coarse)').matches
        var lite = /[?&]lite\b/.test(location.search)
        var phone = matchMedia('(max-width: 600px), (orientation: landscape) and (max-height: 600px)')
        function pick() {
          document.documentElement.classList.toggle('lite3d', lite && !phone.matches)
          document.documentElement.classList.toggle('cull3d', touch && !lite && !phone.matches)
        }
        pick()
        phone.addEventListener('change', pick)
      })()
    </script>
