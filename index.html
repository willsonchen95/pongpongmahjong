<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable as an app: home-screen icon, full screen, red bars to match the table -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#6e1210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Pong Pong" />
    <meta name="viewport" id="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Phones show the game scaled to fit, like a picture: it's laid out for a bigger screen, then
      // shrunk to the phone's real width, so every phone shows the same proportions as a computer
      // instead of a zoomed-in close-up. Held upright it's laid out 480 wide; sideways about 1120
      // wide (less on a stubbier phone, so the page stays under 600 tall and gets the sideways
      // layout in style.css). Tablets and computers are shown at their natural size.
      (function () {
        function fit() {
          var short = Math.min(screen.width, screen.height), long = Math.max(screen.width, screen.height)
          var sideways = matchMedia('(orientation: landscape)').matches
          var real = sideways ? long : short
          var design = sideways ? Math.min(1120, Math.floor(590 * long / short)) : 480
          var content = 'width=device-width, initial-scale=1.0'
          if (short <= 500 && real < design) {
            content = 'width=' + design + ', initial-scale=' + (real / design).toFixed(3)
          }
          var meta = document.getElementById('viewport')
          if (meta.getAttribute('content') !== content) meta.setAttribute('content', content)
        }
        fit()
        addEventListener('orientationchange', function () { setTimeout(fit, 150) })
        addEventListener('resize', fit)
      })()
    </script>
    <script>
      // Phones and tablets draw the table flat (see .lite3d in style.css); ?lite previews it on a computer.
      if (matchMedia('(pointer: coarse)').matches || /[?&]lite\b/.test(location.search)) document.documentElement.classList.add('lite3d')
    </script>
    <title>Pong Pong Mahjong!</title>
    <!-- Only the characters drawn on tile faces, so the font download stays tiny -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The chunky display face for the game's name on the menu -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BC%8D%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E8%90%AC%E6%9D%B1%E5%8D%97%E8%A5%BF%E5%8C%97%E4%B8%AD%E7%99%BC%E6%98%A5%E5%A4%8F%E7%A7%8B%E5%86%AC%E6%A2%85%E8%98%AD%E7%AB%B9%E8%8F%8A%E9%BA%BB%E9%9B%800123456789&display=block" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
