# Netlify builds the game from this repo on every push to main.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"          # Vite 8 needs Node 20.19+ or 22.12+

# Built files have a content hash in their names, so browsers can keep them for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
